name: API Discovery & Data Extraction

on:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main ]

env:
  TARGET_URL: https://www.fotmob.com/matches/japan-u23-vs-north-korea-u23/5fehyhkv#6303284
  MAX_PAGES: 50
  TIMEOUT: 30000

jobs:
  discover-and-extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ==========================================
      # 2. SETUP NODE.JS & PYTHON
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ==========================================
      # 3. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install Playwright & Dependencies
        run: |
          npm install -g playwright
          npm install playwright axios cheerio
          pip install requests beautifulsoup4

      - name: Install Playwright Browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      # ==========================================
      # 4. CREATE SCRAPER SCRIPT
      # ==========================================
      - name: Create API Discovery Scraper
        run: |
          cat > scraper.js << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          // API Collection Storage
          const discoveredAPIs = new Set();
          const extractedData = [];
          const pageUrls = new Set();
          const visitedUrls = new Set();

          // Target patterns for API detection
          const apiPatterns = [
            /\/api\//i,
            /\/v\d+\//i,
            /\/graphql/i,
            /\/rest\//i,
            /\/data\//i,
            /\/feed\//i,
            /\/matches/i,
            /\/leagues/i,
            /\/teams/i,
            /\/players/i,
            /\.json$/i,
            /fotmob/i
          ];

          async function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          async function scrapeWebsite() {
            console.log('🚀 Starting API Discovery on fotmob.com...');
            
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.0'
            });

            const page = await context.newPage();

            // Intercept all network requests
            await page.route('**/*', async (route, request) => {
              const url = request.url();
              const resourceType = request.resourceType();
              
              // Capture API calls
              if (resourceType === 'xhr' || resourceType === 'fetch' || 
                  apiPatterns.some(pattern => pattern.test(url))) {
                
                const apiInfo = {
                  url: url,
                  method: request.method(),
                  headers: await request.allHeaders(),
                  type: resourceType,
                  timestamp: new Date().toISOString()
                };
                
                discoveredAPIs.add(JSON.stringify(apiInfo));
                console.log(`🔍 API Found: ${url}`);
              }
              
              await route.continue();
            });

            try {
              // Navigate to main page
              console.log('📱 Loading main page...');
              await page.goto(process.env.TARGET_URL, { 
                waitUntil: 'networkidle',
                timeout: parseInt(process.env.TIMEOUT) 
              });

              // Wait for dynamic content
              await delay(5000);

              // Extract all links
              const links = await page.evaluate(() => {
                return Array.from(document.querySelectorAll('a[href]'))
                  .map(a => a.href)
                  .filter(href => href.includes('fotmob.com') && !href.includes('#'));
              });

              links.forEach(link => pageUrls.add(link));
              console.log(`🔗 Found ${links.length} links to crawl`);

              // Extract initial page data
              const pageData = await page.evaluate(() => {
                const data = {
                  title: document.title,
                  url: window.location.href,
                  meta: {},
                  scripts: [],
                  initialState: null
                };

                // Extract meta tags
                document.querySelectorAll('meta').forEach(meta => {
                  const name = meta.getAttribute('name') || meta.getAttribute('property');
                  if (name) data.meta[name] = meta.getAttribute('content');
                });

                // Look for JSON data in scripts
                document.querySelectorAll('script').forEach(script => {
                  if (script.textContent.includes('window.__INITIAL_STATE__') || 
                      script.textContent.includes('window.__DATA__')) {
                    data.scripts.push(script.textContent.substring(0, 5000));
                  }
                });

                return data;
              });

              extractedData.push({
                ...pageData,
                scrapedAt: new Date().toISOString()
              });

              // Crawl additional pages
              const maxPages = parseInt(process.env.MAX_PAGES);
              const urlsToVisit = Array.from(pageUrls).slice(0, maxPages);

              for (const url of urlsToVisit) {
                if (visitedUrls.has(url)) continue;
                
                try {
                  console.log(`🌐 Visiting: ${url}`);
                  visitedUrls.add(url);
                  
                  const newPage = await context.newPage();
                  await newPage.goto(url, { 
                    waitUntil: 'domcontentloaded',
                    timeout: 15000 
                  });
                  
                  await delay(3000);

                  // Extract page-specific data
                  const subPageData = await newPage.evaluate(() => ({
                    title: document.title,
                    url: window.location.href,
                    headings: Array.from(document.querySelectorAll('h1, h2, h3')).map(h => h.textContent.trim()),
                    apiEndpoints: Array.from(document.querySelectorAll('script'))
                      .map(s => s.src)
                      .filter(src => src && (src.includes('api') || src.includes('data')))
                  }));

                  extractedData.push({
                    ...subPageData,
                    scrapedAt: new Date().toISOString()
                  });

                  // Get additional links from this page
                  const newLinks = await newPage.evaluate(() => 
                    Array.from(document.querySelectorAll('a[href]'))
                      .map(a => a.href)
                      .filter(href => href.includes('fotmob.com') && !href.includes('#'))
                  );

                  newLinks.forEach(link => {
                    if (!visitedUrls.has(link)) pageUrls.add(link);
                  });

                  await newPage.close();
                  await delay(2000);

                } catch (err) {
                  console.log(`❌ Error visiting ${url}: ${err.message}`);
                }
              }

            } catch (error) {
              console.error('❌ Scraping error:', error);
            } finally {
              await browser.close();
            }

            // Save results
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const outputDir = path.join('data', timestamp);
            
            if (!fs.existsSync('data')) fs.mkdirSync('data');
            fs.mkdirSync(outputDir, { recursive: true });

            // Save discovered APIs
            const apisArray = Array.from(discoveredAPIs).map(JSON.parse);
            fs.writeFileSync(
              path.join(outputDir, 'discovered_apis.json'),
              JSON.stringify(apisArray, null, 2)
            );

            // Save extracted page data
            fs.writeFileSync(
              path.join(outputDir, 'extracted_data.json'),
              JSON.stringify(extractedData, null, 2)
            );

            // Save summary
            const summary = {
              timestamp: new Date().toISOString(),
              targetUrl: process.env.TARGET_URL,
              totalApisFound: apisArray.length,
              totalPagesScraped: extractedData.length,
              totalUrlsDiscovered: pageUrls.size,
              apiEndpoints: apisArray.map(a => a.url)
            };
            
            fs.writeFileSync(
              path.join(outputDir, 'summary.json'),
              JSON.stringify(summary, null, 2)
            );

            // Update latest symlink
            const latestLink = path.join('data', 'latest');
            if (fs.existsSync(latestLink)) fs.unlinkSync(latestLink);
            fs.symlinkSync(outputDir, latestLink, 'dir');

            console.log('✅ Scraping complete!');
            console.log(`📊 Found ${apisArray.length} APIs`);
            console.log(`📄 Scraped ${extractedData.length} pages`);
          }

          scrapeWebsite().catch(console.error);
          EOF

      # ==========================================
      # 5. CREATE PYTHON ANALYZER (Optional Enhancement)
      # ==========================================
      - name: Create Python API Analyzer
        run: |
          cat > analyzer.py << 'EOF'
          import json
          import os
          import re
          from urllib.parse import urlparse, parse_qs
          from datetime import datetime

          def analyze_apis():
              data_dir = 'data/latest'
              
              if not os.path.exists(f'{data_dir}/discovered_apis.json'):
                  print("No API data found")
                  return

              with open(f'{data_dir}/discovered_apis.json', 'r') as f:
                  apis = json.load(f)

              analysis = {
                  'endpoints_by_domain': {},
                  'endpoint_patterns': {},
                  'query_params': {},
                  'api_types': {
                      'rest': [],
                      'graphql': [],
                      'websocket': [],
                      'other': []
                  },
                  'potential_leagues': [],
                  'potential_matches': [],
                  'recommendations': []
              }

              for api in apis:
                  url = api.get('url', '')
                  parsed = urlparse(url)
                  domain = parsed.netloc
                  path = parsed.path

                  # Categorize by domain
                  if domain not in analysis['endpoints_by_domain']:
                      analysis['endpoints_by_domain'][domain] = []
                  analysis['endpoints_by_domain'][domain].append(path)

                  # Detect API type
                  if 'graphql' in url.lower():
                      analysis['api_types']['graphql'].append(url)
                  elif re.search(r'/v\d+/', url):
                      analysis['api_types']['rest'].append(url)
                  elif 'ws://' in url or 'wss://' in url:
                      analysis['api_types']['websocket'].append(url)
                  else:
                      analysis['api_types']['other'].append(url)

                  # Extract patterns
                  patterns = re.findall(r'/([^/]+/\d+)', url)
                  for pattern in patterns:
                      if pattern not in analysis['endpoint_patterns']:
                          analysis['endpoint_patterns'][pattern] = 0
                      analysis['endpoint_patterns'][pattern] += 1

                  # Parse query params
                  params = parse_qs(parsed.query)
                  for key in params.keys():
                      if key not in analysis['query_params']:
                          analysis['query_params'][key] = set()
                      analysis['query_params'][key].update(params[key])

                  # Detect fotmob-specific patterns
                  if 'league' in url.lower():
                      analysis['potential_leagues'].append(url)
                  if 'match' in url.lower():
                      analysis['potential_matches'].append(url)

              # Convert sets to lists for JSON serialization
              for key in analysis['query_params']:
                  analysis['query_params'][key] = list(analysis['query_params'][key])

              # Generate recommendations
              if analysis['api_types']['rest']:
                  analysis['recommendations'].append({
                      'type': 'REST API detected',
                      'suggestion': 'Use standard HTTP methods (GET/POST) with these endpoints',
                      'endpoints': analysis['api_types']['rest'][:5]
                  })

              if analysis['potential_matches']:
                  analysis['recommendations'].append({
                      'type': 'Match data endpoints',
                      'suggestion': 'These URLs likely contain live match data',
                      'endpoints': analysis['potential_matches'][:5]
                  })

              # Save analysis
              with open(f'{data_dir}/api_analysis.json', 'w') as f:
                  json.dump(analysis, f, indent=2)

              print(f"📈 Analyzed {len(apis)} API endpoints")
              print(f"🔍 Found {len(analysis['api_types']['rest'])} REST endpoints")
              print(f"⚽ Found {len(analysis['potential_matches'])} match endpoints")

          if __name__ == '__main__':
              analyze_apis()
          EOF

      # ==========================================
      # 6. RUN SCRAPER
      # ==========================================
      - name: Execute API Discovery
        run: node scraper.js
        env:
          TARGET_URL: ${{ env.TARGET_URL }}
          MAX_PAGES: ${{ env.MAX_PAGES }}
          TIMEOUT: ${{ env.TIMEOUT }}

      # ==========================================
      # 7. RUN ANALYZER
      # ==========================================
      - name: Analyze Discovered APIs
        run: python analyzer.py

      # ==========================================
      # 8. COMMIT & PUSH RESULTS
      # ==========================================
      - name: Commit and Push Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Add all new data
          git add data/
          
          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')
            git commit -m "🤖 Auto: API Discovery & Data Extraction - $TIMESTAMP
          
          - Discovered new API endpoints from fotmob.com
          - Extracted page data and metadata
          - Generated analysis report
          
          [skip ci]"
            
            git push
            echo "✅ Data committed and pushed successfully"
          fi

      # ==========================================
      # 9. UPLOAD ARTIFACTS (Backup)
      # ==========================================
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-discovery-data
          path: |
            data/
          retention-days: 30

      # ==========================================
      # 10. SUMMARY OUTPUT
      # ==========================================
      - name: Output Summary
        run: |
          echo "## 🔍 API Discovery Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f data/latest/summary.json ]; then
            APIS=$(jq '.totalApisFound' data/latest/summary.json)
            PAGES=$(jq '.totalPagesScraped' data/latest/summary.json)
            
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| APIs Discovered | $APIS |" >> $GITHUB_STEP_SUMMARY
            echo "| Pages Scraped | $PAGES |" >> $GITHUB_STEP_SUMMARY
            echo "| Target | ${{ env.TARGET_URL }} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "### 📡 Sample API Endpoints" >> $GITHUB_STEP_SUMMARY
            jq -r '.apiEndpoints[:10][]' data/latest/summary.json | while read url; do
              echo "- \`$url\`" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "⚠️ No data generated" >> $GITHUB_STEP_SUMMARY
          fi
