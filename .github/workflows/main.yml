name: FotMob Live API Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:

  monitor:

    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. CHECKOUT
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. SETUP PYTHON
      # ============================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================
      # 3. INSTALL PLAYWRIGHT
      # ============================================

      - name: Install Playwright
        run: |

          python -m pip install --upgrade pip

          pip install playwright


      # ============================================
      # 4. INSTALL CHROMIUM
      # ============================================

      - name: Install Chromium
        run: |

          python -m playwright install chromium

          python -m playwright install-deps chromium


      # ============================================
      # 5. CHECK f.py
      # ============================================

      - name: Check f.py
        run: |

          echo "Checking scripts/f.py..."

          test -f scripts/f.py

          python -m py_compile scripts/f.py

          echo "f.py is valid."


      # ============================================
      # 6. RUN f.py
      # ============================================

      - name: Run FotMob monitor
        run: |

          python scripts/f.py


      # ============================================
      # 7. SHOW SUMMARY
      # ============================================

      - name: Show summary
        if: always()
        run: |

          echo "============================================"

          echo "FOTMOB MONITOR SUMMARY"

          echo "============================================"

          if [ -f data/latest/summary.json ]; then

            cat data/latest/summary.json

          else

            echo "summary.json not found."

          fi


      # ============================================
      # 8. SHOW MATCH DETAILS
      # ============================================

      - name: Show matchDetails
        if: always()
        run: |

          echo "============================================"

          echo "MATCH DETAILS"

          echo "============================================"

          if [ -f data/latest/matchDetails.json ]; then

            cat data/latest/matchDetails.json

          else

            echo "matchDetails.json not found."

          fi


      # ============================================
      # 9. COMMIT DATA
      # ============================================

      - name: Commit data
        if: always()
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit -m "Update FotMob live data"

            git push

          fi


      # ============================================
      # 10. UPLOAD ARTIFACT
      # ============================================

      - name: Upload monitoring data
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: fotmob-live-monitor

          path: |

            data/latest/

            data/live/

          retention-days: 7
